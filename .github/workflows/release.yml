# Push a tag like v0.1.0 to publish a release with a ready-to-install extension zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: node --test extension/tests/core.test.js
      - name: Tag matches manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "manifest version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Package extension
        run: |
          cd extension
          zip -r "../PennReach-${GITHUB_REF_NAME}.zip" . -x "tests/*" "icons/icon.svg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PennReach-${GITHUB_REF_NAME}.zip" \
            --title "PennReach $GITHUB_REF_NAME" --notes-file .github/release-notes.md
