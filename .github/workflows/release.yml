# Publishes a GitHub release with a ready-to-install extension zip.
# Start it either way:
#   - Actions tab -> "Release" -> "Run workflow" (uses the version in extension/manifest.json), or
#   - push a tag like v0.1.0 that matches the manifest version.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: node --test extension/tests/core.test.js
      - name: Work out the version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $v"; exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: Package extension
        run: |
          cd extension
          zip -r "../PennReach-${TAG}.zip" . -x "tests/*" "icons/icon.svg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "PennReach-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "PennReach-${TAG}.zip" --target "$GITHUB_SHA" \
              --title "PennReach $TAG" --notes-file .github/release-notes.md
          fi
