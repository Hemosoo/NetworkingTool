[project]
name = "pennreach"
version = "0.1.0"
description = "Penn freshman networking assistant: find incoming seniors at top firms, look up their Penn email, and send personal coffee-chat requests with a review queue."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pennreach = "pennreach.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pennreach"]
